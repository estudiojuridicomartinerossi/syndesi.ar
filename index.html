    * {

      border: none;
      border-radius: 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
      text-align: center;
    }

    .button:hover {
      background-color: var(--primary);
      color: white;
    }

    .section {
      max-width: 600px;
      text-align: center;
      margin-top: 2rem;
    }

      padding: 2rem;

      font-style: italic;

  </style>
