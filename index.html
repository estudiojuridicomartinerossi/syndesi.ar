<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sýndesi</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #f5eee6;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #3a2e2a;
    }
    h1 {
      font-size: 3em;
      margin-top: 1em;
      color: #7c6659;
    }
    p {
      font-size: 1.3em;
      margin: 0.5em auto;
      max-width: 600px;
    }
    img {
      margin-top: 1em;
      max-width: 90%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .button {
      display: block;
      width: 80%;
      max-width: 400px;
      margin: 1em auto;
      padding: 1em;
      background-color: #d8c4b6;
      color: #1c2e4a;
      font-size: 1.2em;
      border: none;
      border-radius: 2em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #cdb3a5;
    }
  </style>
</head>
<body>
  <h1>Sýndesi</h1>
  <p>No necesitás estar bien para estar acá.</p>

  <img src="imagen/Syndesiacceso.png" alt="Guía paso a paso para entrar a Sýndesi" />

  <button class="button">Acompañame un minuto</button>
  <button class="button">Quiero escribir lo que siento</button>
  <button class="button">No sé qué necesito. Solo quiero estar</button>
</body>
</html>
