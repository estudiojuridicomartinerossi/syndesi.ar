        /* NAVBAR */
        .navbar {
            width: 100%;
            background-color: #f4efe9;
            border-bottom: 1px solid #d8d2c9;
            padding: 15px 40px;
            display: flex;

            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .logo {
            height: 48px;
            opacity: 0.95;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

            text-decoration: none;
            color: #2e2e2e;
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid #2e2e2e;
            transition: 0.2s;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            background-color: #2e2e2e;
            color: #f4efe9;
        }
